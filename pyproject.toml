[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skontofrist-dach"
version = "1.0.0"
description = "DACH Skontofrist-, Zahlungsziel- & Bankarbeitstage-Rechner 2026 (§ 193 BGB, § 903 ABGB, Art. 78 OR)"
readme = "README.md"
authors = [{ name = "DACH Digitalwerk", email = "dach.digitalwerk@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dach-skontofrist = "skontofrist_dach.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
